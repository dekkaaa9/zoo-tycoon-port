plugins {
    id 'com.android.application'
}

android {
    namespace = "org.rustyzoo"
    compileSdkVersion 35
    ndkVersion = "30.0.16248370"

    defaultConfig {
        applicationId "org.rustyzoo"
        minSdkVersion 21
        targetSdkVersion 35
        versionCode 1
        versionName "0.1"
        // The Rust build produces one .so per ABI; add more here when they are built.
        ndk {
            abiFilters 'arm64-v8a'
        }
    }

    // The native library is built by Cargo, not by Gradle: `android/build-core.bat` drops
    // librustyzoo.so into app/src/main/jniLibs/<abi>/. Gradle only packages it.
    sourceSets.main {
        jniLibs.srcDirs = ['src/main/jniLibs']
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }

    lint {
        abortOnError = false
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
}
