# Android cross-compilation config for RustyZoo.
#
# Usage: copy the relevant [target.*] blocks into .cargo/config.toml, or build with
#   CARGO_TARGET_CONFIG=... (see the android/ scripts) and set ANDROID_NDK_HOME.
#
# The NDK path below is absolute on this machine; override it with the ANDROID_NDK_HOME
# environment variable on another machine (the scripts do this).

[target.aarch64-linux-android]
linker = "aarch64-linux-android21-clang"
rustflags = ["-C", "link-arg=-Wl,-z,max-page-size=16384"]

[target.armv7-linux-androideabi]
linker = "armv7a-linux-androideabi21-clang"
rustflags = ["-C", "link-arg=-Wl,-z,max-page-size=16384"]

[target.x86_64-linux-android]
linker = "x86_64-linux-android21-clang"
rustflags = ["-C", "link-arg=-Wl,-z,max-page-size=16384"]

[target.i686-linux-android]
linker = "i686-linux-android21-clang"
rustflags = ["-C", "link-arg=-Wl,-z,max-page-size=16384"]
